<div class="page">
  <header class="page__header">
    <app-logo variant="mark" />
  </header>

  <main class="card">
    <div class="card__head">
      <div>
        <h1 class="card__title">Complete seu perfil</h1>
        <p class="card__lead">
          Para acessar a comunidade e a trilha, informe seus dados de identificação.
        </p>
      </div>
      <button type="button" class="card__logout-btn" (click)="openLogoutConfirm()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Sair
      </button>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span class="field__label">Nome completo</span>
        <input
          class="field__input"
          type="text"
          formControlName="name"
          autocomplete="name"
          placeholder="Como quer ser chamado"
          [attr.aria-invalid]="isFieldInvalid('name') ? 'true' : null"
          [attr.aria-describedby]="isFieldInvalid('name') ? 'erro-nome' : null"
        />
        @if (isFieldInvalid('name')) {
          <span class="field__error" id="erro-nome">Informe o seu nome (entre 2 e 120 caracteres).</span>
        }
      </label>

      <label class="field">
        <span class="field__label">Telefone com DDD</span>
        <input
          class="field__input"
          type="tel"
          inputmode="tel"
          formControlName="phone"
          autocomplete="tel"
          placeholder="(47) 99999-0000"
          [attr.aria-invalid]="isFieldInvalid('phone') ? 'true' : null"
          [attr.aria-describedby]="isFieldInvalid('phone') ? 'erro-telefone' : null"
        />
        @if (isFieldInvalid('phone')) {
          <span class="field__error" id="erro-telefone">Informe um telefone válido com DDD (10 ou 11 dígitos).</span>
        }
      </label>

      <label class="field">
        <div class="field__head">
          <span class="field__label">Bio</span>
          <span class="field__counter u-mono">{{ bioLength() }}/500</span>
        </div>
        <textarea
          class="field__textarea"
          rows="3"
          formControlName="bio"
          placeholder="Conte um pouco sobre sua jornada e seus objetivos na programação (mínimo de 10 caracteres)."
          [attr.aria-invalid]="isFieldInvalid('bio') ? 'true' : null"
          [attr.aria-describedby]="isFieldInvalid('bio') ? 'erro-bio' : null"
        ></textarea>
        @if (isFieldInvalid('bio')) {
          <span class="field__error" id="erro-bio">A bio deve conter entre 10 e 500 caracteres.</span>
        }
      </label>

      @if (errorMessage()) {
        <p class="form__error" role="alert">{{ errorMessage() }}</p>
      }

      <button class="submit" type="submit" [disabled]="form.invalid || sending()">
        @if (sending()) {
          <span class="submit__spinner" aria-hidden="true"></span>
          Salvando dados...
        } @else {
          Concluir perfil e ir para o painel
        }
      </button>
    </form>
  </main>
</div>

<app-confirm-dialog
  #logoutDialog
  title="Sair da Seita Dev?"
  message="Deseja encerrar sua sessão agora? Você poderá voltar e completar o perfil depois."
  confirmLabel="Sair"
  cancelLabel="Cancelar"
  [danger]="true"
  (confirmed)="confirmLogout()"
/>
